name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint + tests + coverage (Windows PowerShell 5.1)
        shell: powershell
        run: .\build.ps1

      - name: Lint + tests + coverage (PowerShell 7)
        shell: pwsh
        run: .\build.ps1

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
